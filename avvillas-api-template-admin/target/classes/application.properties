# Global config
server.port=${PORT:8084}
spring.application.name=template_admin
server.servlet.context-path=/template-admin
logging.level.org.springframework.security=INFO
spring.profiles.active=prod

# Oracle connection
spring.datasource.url=jdbc:oracle:thin:@${DB_HOST}:${PUERTO_BD}/${SERVICIO_BD}
spring.datasource.username=TEMPLATE_ADMIN
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA config
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

